name: ci

# Every pull request and every push to main: the code is linted, type-checked and tested
# against a real Postgres 17 with all migrations applied, the same way the tests run locally.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PGHOST: localhost
  PGPORT: '5432'
  PGUSER: ops
  PGPASSWORD: ops
  PGDATABASE: ops
  PGDASHPASS: devpass

jobs:
  dashboard:
    name: dashboard (lint, types, tests, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ops" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Migrations
        working-directory: .
        run: ./scripts/ci-migrate.sh
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: dashboard end-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ops" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Migrations
        working-directory: .
        run: ./scripts/ci-migrate.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            dashboard/playwright-report
            dashboard/test-results
          retention-days: 7

  database:
    name: database and workflow code
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ops" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrations
        run: ./scripts/ci-migrate.sh
      - name: Schema and role checks
        run: |
          for f in infra/tests/0*.sql; do psql -X -q -v ON_ERROR_STOP=1 -f "$f" > /dev/null; echo "ok $f"; done
      - name: Workflow code (normalize, retries, costs, alerts)
        run: for f in workflows/ops/src/*.test.js; do node "$f"; done
      - name: Database behaviour
        run: for t in infra/tests/test_*.py; do python3 "$t"; done

  watchdog:
    name: watchdog
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: watchdog/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
